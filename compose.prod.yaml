# Stack de produção. Suba com:
#   docker compose -f compose.prod.yaml up -d --build
# (no deploy via CI, BACKEND_IMAGE aponta para o GHCR e usa-se `pull` em vez de `--build`)
services:
  postgres:
    image: 'postgres:15-alpine'
    environment:
      - 'POSTGRES_DB=${DATABASE_NAME:-vitapair}'
      - 'POSTGRES_USER=${DATABASE_USER:-vitapair}'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD:?defina DATABASE_PASSWORD}'
    volumes:
      - 'vitapair_pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-vitapair} -d ${DATABASE_NAME:-vitapair}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: 'redis:7-alpine'
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD}']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: '${BACKEND_IMAGE:-vitapair-backend:local}'
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'DATABASE_URL=jdbc:postgresql://postgres:5432/${DATABASE_NAME:-vitapair}'
      - 'DATABASE_USER=${DATABASE_USER:-vitapair}'
      - 'DATABASE_PASSWORD=${DATABASE_PASSWORD}'
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6379'
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
      - 'JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET (min 32 caracteres)}'
      - 'JWT_ACCESS_EXPIRATION_MS=${JWT_ACCESS_EXPIRATION_MS:-900000}'
      - 'JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS:-2592000000}'
      - 'FRONTEND_URL=${FRONTEND_URL:-https://vitapair.duckdns.org}'
      - 'GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}'
      - 'OPEN_FOOD_FACTS_USER_AGENT=${OPEN_FOOD_FACTS_USER_AGENT:-VitaPair/1.0 (contact@vitapair.app)}'
    expose:
      - '8080'
    restart: unless-stopped

  nginx:
    image: 'nginx:alpine'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - 'certbot_certs:/etc/letsencrypt:ro'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vitapair_pgdata:
  certbot_certs:
