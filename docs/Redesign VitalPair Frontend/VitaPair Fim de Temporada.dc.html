<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&family=Nunito:wght@400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0}
@keyframes vpPop{0%{opacity:0;transform:scale(.8) translateY(20px)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes vpRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes vpFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes vpFall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(620px) rotate(360deg);opacity:0}}
@keyframes vpGlow{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}
.vp-conf{position:absolute;width:9px;height:9px;border-radius:2px;top:0;animation:vpFall linear infinite}
</style>
</helmet>

<div style="{{ rootStyle }}">
  <button onClick="{{ toggleTheme }}" style="position:fixed;top:18px;right:18px;z-index:20;width:36px;height:36px;border-radius:11px;border:1px solid var(--hair);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M20 14.5A8 8 0 119.5 4 6.5 6.5 0 0020 14.5z"/></svg></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg></sc-if></button>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative;overflow:hidden">
    <!-- confete discreto -->
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
      <span class="vp-conf" style="left:12%;background:#ff7a1a;animation-duration:3.2s;animation-delay:0s"></span>
      <span class="vp-conf" style="left:24%;background:#22c55e;animation-duration:3.8s;animation-delay:.6s"></span>
      <span class="vp-conf" style="left:38%;background:#7c3aed;animation-duration:3s;animation-delay:1.1s"></span>
      <span class="vp-conf" style="left:52%;background:#ff7a1a;animation-duration:4s;animation-delay:.3s"></span>
      <span class="vp-conf" style="left:66%;background:#22c55e;animation-duration:3.4s;animation-delay:.9s"></span>
      <span class="vp-conf" style="left:78%;background:#7c3aed;animation-duration:3.6s;animation-delay:1.4s"></span>
      <span class="vp-conf" style="left:88%;background:#ff7a1a;animation-duration:3.1s;animation-delay:.2s"></span>
    </div>

    <div style="width:480px;max-width:100%;text-align:center;position:relative;z-index:1">
      <div style="font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--orange-ink);margin-bottom:18px;animation:vpRise .4s ease both">TEMPORADA 01 · ACABOU</div>

      <!-- troféu/anel -->
      <div style="position:relative;width:150px;height:150px;margin:0 auto 8px;animation:vpPop .6s cubic-bezier(.34,1.4,.5,1) both">
        <div style="position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:vpGlow 2.4s ease-in-out infinite"></div>
        <div style="position:relative;width:150px;height:150px;display:flex;align-items:flex-end;justify-content:center;animation:vpFloat 3s ease-in-out infinite"><dc-import name="Broto" who="you" expr="strong" level="8" size="150" hint-size="128px,150px"></dc-import></div>
      </div>

      <h1 style="font:600 38px 'Fredoka';letter-spacing:-.02em;color:var(--ink);margin:14px 0 6px;animation:vpRise .5s ease .1s both">Você venceu! 🎉</h1>
      <p style="font-size:15px;color:var(--muted);font-weight:600;margin:0 0 24px;animation:vpRise .5s ease .15s both">30 dias, sem desistir. A Célia que se cuide na próxima.</p>

      <!-- placar final -->
      <div style="background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:22px;margin-bottom:14px;animation:vpRise .5s ease .2s both;box-shadow:0 14px 36px var(--shadow)">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="text-align:center;flex:1">
            <div style="width:50px;margin:0 auto 4px;display:flex;align-items:flex-end;justify-content:center"><dc-import name="Broto" who="you" expr="happy" level="8" size="50" hint-size="42px,52px"></dc-import></div>
            <div style="font-size:11px;font-weight:800;color:var(--orange-ink)">VOCÊ</div>
            <div style="font:600 32px 'Fredoka';color:var(--ink);line-height:1">980</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:var(--green)"><path d="M12 2l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17l-5.8 3 1.1-6.5L2.6 8.8l6.5-.9z"/></svg><span style="font-size:10px;font-weight:800;color:var(--green-ink)">+60 vantagem</span></div>
          <div style="text-align:center;flex:1">
            <div style="width:50px;margin:0 auto 4px;display:flex;align-items:flex-end;justify-content:center;opacity:.9"><dc-import name="Broto" who="partner" expr="sad" size="50" hint-size="42px,52px"></dc-import></div>
            <div style="font-size:11px;font-weight:800;color:var(--purple-ink)">CÉLIA</div>
            <div style="font:600 32px 'Fredoka';color:var(--muted);line-height:1">920</div>
          </div>
        </div>
      </div>

      <!-- aposta -->
      <div style="background:var(--arena);border:1px solid var(--arenaBorder);border-radius:16px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:10px;animation:vpRise .5s ease .25s both">
        <span style="font-size:20px">🍣</span><span style="font-size:14px;font-weight:800;color:var(--arenaText)">A Célia te paga o jantar. Combinado é combinado.</span>
      </div>

      <button style="width:100%;border:none;background:var(--orange);color:#fff;font:800 16px 'Nunito';padding:16px;border-radius:15px;cursor:pointer;animation:vpRise .5s ease .3s both;box-shadow:0 8px 22px rgba(255,94,44,.35)">Bora pra temporada 2</button>
      <div style="margin-top:12px;font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer;animation:vpRise .5s ease .35s both">ver o resumo dos 30 dias</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'light' };
  tokens() {
    const light = this.state.theme === 'light';
    return light ? {
      canvas:'#fbf6ee', surface:'#ffffff', ink:'#241f17', muted:'#8a7f6d', hair:'#ece1cf',
      orange:'#ff6b2c','orange-ink':'#e0561c', purple:'#7c3aed','purple-ink':'#6d28d9', green:'#22c55e','green-ink':'#1aa34a',
      glow:'rgba(255,138,76,.4)', shadow:'rgba(120,80,30,.16)',
      arena:'#fff3e9', arenaText:'#241f17', arenaBorder:'#f3ddc7'
    } : {
      canvas:'#1b1610', surface:'#251e16', ink:'#f7efe1', muted:'#a99a85', hair:'#352a1f',
      orange:'#ff8a4c','orange-ink':'#ffa066', purple:'#a855f7','purple-ink':'#c4a9f8', green:'#4ade80','green-ink':'#5ed98e',
      glow:'rgba(255,138,76,.3)', shadow:'rgba(0,0,0,.5)',
      arena:'#322619', arenaText:'#ffffff', arenaBorder:'rgba(255,255,255,.07)'
    };
  }
  renderVals() {
    const t = this.tokens(); const light = this.state.theme === 'light';
    const vars = Object.entries(t).map(([k,v]) => `--${k}:${v}`).join(';');
    return {
      rootStyle: `${vars};background:${t.canvas};color:${t.ink};min-height:100vh;font-family:'Nunito',sans-serif;transition:background .3s ease`,
      isLight: light, isDark: !light,
      toggleTheme: () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }))
    };
  }
}
</script>
</body>
</html>
