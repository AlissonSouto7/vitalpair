<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..600&family=Nunito:wght@400..900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0}@keyframes vpRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>

<div style="{{ rootStyle }}">
  <button onClick="{{ toggleTheme }}" style="position:fixed;top:18px;right:18px;z-index:20;width:36px;height:36px;border-radius:11px;border:1px solid var(--hair);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center"><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M20 14.5A8 8 0 119.5 4 6.5 6.5 0 0020 14.5z"/></svg></sc-if><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg></sc-if></button>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px">
    <div style="width:400px;max-width:100%;text-align:center;animation:vpRise .4s ease both">
      <div style="display:flex;align-items:center;gap:-8px;justify-content:center;margin-bottom:24px">
        <div style="width:58px;display:flex;align-items:flex-end;justify-content:center;z-index:2"><dc-import name="Broto" who="partner" expr="happy" size="58" hint-size="48px,60px"></dc-import></div>
        <div style="width:58px;display:flex;align-items:flex-end;justify-content:center;margin-left:-10px"><dc-import name="Broto" who="you" expr="happy" size="58" hint-size="48px,60px"></dc-import></div>
      </div>
      <h1 style="font:600 28px 'Fredoka';letter-spacing:-.02em;color:var(--ink);margin:0 0 8px">A Célia te chamou pra jogar</h1>
      <p style="font-size:14.5px;color:var(--muted);font-weight:600;margin:0 0 28px;line-height:1.5">Ela já tá esperando do outro lado. É só entrar o código que vocês começam a temporada juntos.</p>

      <div style="background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:24px;margin-bottom:16px;box-shadow:0 10px 30px var(--shadow)">
        <label style="display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px">Código do convite</label>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--purple);background:var(--purpleSoft);border-radius:13px;padding:14px">
          <span style="font:600 26px 'Fredoka';letter-spacing:.22em;color:var(--purple-ink)">VITA-8K2P</span>
        </div>
      </div>

      <button style="width:100%;border:none;background:var(--orange);color:#fff;font:800 15px 'Nunito';padding:15px;border-radius:14px;cursor:pointer;margin-bottom:12px">Aceitar e começar</button>
      <div style="font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer">agora não — só quero dar uma olhada</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'light' };
  tokens() {
    const light = this.state.theme === 'light';
    return light ? {
      canvas:'#fbf6ee', surface:'#ffffff', ink:'#241f17', muted:'#8a7f6d', hair:'#ece1cf',
      orange:'#ff6b2c', purple:'#7c3aed','purple-ink':'#6d28d9', purpleSoft:'#f3ecff', shadow:'rgba(120,80,30,.14)'
    } : {
      canvas:'#1b1610', surface:'#251e16', ink:'#f7efe1', muted:'#a99a85', hair:'#352a1f',
      orange:'#ff8a4c', purple:'#a855f7','purple-ink':'#c4a9f8', purpleSoft:'rgba(168,85,247,.16)', shadow:'rgba(0,0,0,.4)'
    };
  }
  renderVals() {
    const t = this.tokens(); const light = this.state.theme === 'light';
    const vars = Object.entries(t).map(([k,v]) => `--${k}:${v}`).join(';');
    return {
      rootStyle: `${vars};background:${t.canvas};color:${t.ink};min-height:100vh;font-family:'Nunito',sans-serif;transition:background .3s ease`,
      isLight: light, isDark: !light,
      toggleTheme: () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }))
    };
  }
}
</script>
</body>
</html>
