# Included by the staging site only. Production includes production.conf instead, which
# answers 404 on these same paths.
#
# Everything here is behind basic auth. The API documentation and the dashboards describe
# how the product is built and how it is used, which is for the team and not for the
# internet. The credentials come from env/htpasswd, written by scripts/htpasswd.sh.
#
# The Authorization header that carries those credentials is stripped before proxying:
# Grafana would read it as one of its own logins and refuse every request, and the API has
# no use for it. $backend is set by the site that includes this file.

location /swagger-ui/ {
    auth_basic "VitalPair staging";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Authorization "";
    proxy_pass http://$backend:8080;
    include /etc/nginx/proxy_params.conf;
}

location = /swagger-ui.html {
    auth_basic "VitalPair staging";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Authorization "";
    proxy_pass http://$backend:8080;
    include /etc/nginx/proxy_params.conf;
}

location /v3/api-docs {
    auth_basic "VitalPair staging";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Authorization "";
    proxy_pass http://$backend:8080;
    include /etc/nginx/proxy_params.conf;
}

# Grafana runs from compose.monitoring.yaml with GF_SERVER_ROOT_URL ending in /grafana/ and
# serve_from_sub_path on, so the prefix is passed through untouched. Its own login still
# applies behind this one.
location /grafana/ {
    auth_basic "VitalPair staging";
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_set_header Authorization "";
    set $grafana grafana;
    proxy_pass http://$grafana:3000;
    include /etc/nginx/proxy_params.conf;
}
