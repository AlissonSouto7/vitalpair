# Included by the production site only.
#
# The documentation and the dashboards do not exist here, and these paths say so with a
# 404 rather than falling through to the single-page application, which would answer 200
# and look, from outside, exactly like something being there.

location /swagger-ui/ {
    return 404;
}

location = /swagger-ui.html {
    return 404;
}

location /v3/api-docs {
    return 404;
}

location /grafana/ {
    return 404;
}
