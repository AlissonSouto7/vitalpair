# Headers every proxied request needs, in one place so the three locations cannot drift.
#
# X-Forwarded-For is the one that matters most: without it every request reaches the
# application from the proxy's address, so the per-IP rate limiter counts the whole
# internet as one caller and one abusive visitor locks everybody out. The application
# trusts these because forward-headers-strategy is set to native and Tomcat only honours
# them from a private address, which is where this proxy sits.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# The application answers with a request id; passing the caller's through means a report
# from a user and the server log line share one identifier.
proxy_set_header X-Request-Id $http_x_request_id;

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 5s;
