# Prometheus and Grafana, for staging.
#
#   docker compose -f deploy/compose.monitoring.yaml --env-file deploy/env/staging.env up -d
#
# Phase 8 put the application's metrics on their own port so that nothing outside could
# reach them. This stack is the thing that reads that port, and it joins the same `edge`
# network to do it. It publishes nothing to the host either: Grafana is reached through the
# edge proxy, behind basic auth, the same way Swagger is on staging.
#
# Staging only, on purpose. On one machine, a scraper and a dashboard competing with the
# application for memory is a worse trade than not having graphs in production, and the
# metrics are still there to scrape from somewhere else the day there is a second machine.
# Logs are not collected here: Loki earns its keep across several nodes, and with one node
# `docker compose logs` answers the same question without another service to run.

name: 'vitalpair-monitoring'

services:
  prometheus:
    image: 'prom/prometheus:v3.1.0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Fifteen days is enough to see a leak build up over a fortnight and cheap enough to
      # keep on a small disk. Longer needs remote storage, not a bigger number here.
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
    volumes:
      - './monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheusdata:/prometheus'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: '${PROMETHEUS_MEM_LIMIT:-256m}'
    cpus: '${PROMETHEUS_CPUS:-0.5}'
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      edge:
        aliases: ['prometheus']

  grafana:
    image: 'grafana/grafana:11.4.0'
    environment:
      # No anonymous access and no sign-up: this dashboard shows how the product is used,
      # which is not public. The password is required rather than defaulted, because a
      # monitoring stack with admin/admin on the internet is how the machine gets taken.
      GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Served under a path by the edge proxy rather than on its own hostname, so it needs
      # to know its own root or every link it renders points at the wrong place.
      GF_SERVER_ROOT_URL: '${GRAFANA_ROOT_URL:-http://localhost/grafana/}'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - './monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafanadata:/var/lib/grafana'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: '${GRAFANA_MEM_LIMIT:-256m}'
    cpus: '${GRAFANA_CPUS:-0.5}'
    logging: *logging
    networks:
      edge:
        aliases: ['grafana']

volumes:
  prometheusdata:
  grafanadata:

networks:
  # Created by compose.edge.yaml. The application stack is reachable here by its aliases,
  # which is how Prometheus scrapes it without any port being published.
  edge:
    external: true
    name: vitalpair_edge
