# One application stack: database, cache, API and interface.
#
# The same file serves staging and production; what differs is the env file and the network
# alias, so the two stacks can run side by side on one machine without either knowing.
#
#   docker compose -f deploy/compose.app.yaml --env-file deploy/env/staging.env up -d
#
# Nothing here publishes a port to the host. The edge proxy (compose.edge.yaml) is the only
# thing the internet reaches, and it finds these services over the shared `edge` network.
# That is what keeps Postgres, Redis and the management port off the public interface, and
# it is deliberate: metrics live on their own port precisely so they would not be exposed,
# and publishing 9090 here would undo that.

name: 'vitalpair-${ENVIRONMENT:?set ENVIRONMENT (staging or production)}'

services:
  postgres:
    # Same major version as the tests and local development. A deploy onto a different
    # major would run migrations nobody exercised.
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: '${DATABASE_NAME:-vitalpair}'
      POSTGRES_USER: '${DATABASE_USER:-vitalpair}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD:?set DATABASE_PASSWORD}'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-vitalpair} -d ${DATABASE_NAME:-vitalpair}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Without a limit one runaway query can take the whole machine down, including the
    # proxy, so a database problem becomes a total outage.
    mem_limit: '${POSTGRES_MEM_LIMIT:-512m}'
    cpus: '${POSTGRES_CPUS:-1.0}'
    logging: &logging
      driver: json-file
      options:
        # Docker never rotates logs by default: the disk fills silently and the first
        # symptom is the whole machine failing to write anything.
        max-size: '10m'
        max-file: '3'
    networks: [internal]

  redis:
    image: 'redis:7-alpine'
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
        '--save',
        '60',
        '1',
      ]
    healthcheck:
      # redis-cli reads the password from REDISCLI_AUTH; passed as -a it would sit in the
      # process list of the container for the length of every check.
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDISCLI_AUTH: '${REDIS_PASSWORD}'
    volumes:
      - 'redisdata:/data'
    restart: unless-stopped
    mem_limit: '${REDIS_MEM_LIMIT:-256m}'
    cpus: '${REDIS_CPUS:-0.5}'
    logging: *logging
    networks: [internal]

  backend:
    image: '${BACKEND_IMAGE:-vitalpair-backend:local}'
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: 'prod'
      DATABASE_URL: 'jdbc:postgresql://postgres:5432/${DATABASE_NAME:-vitalpair}'
      DATABASE_USER: '${DATABASE_USER:-vitalpair}'
      DATABASE_PASSWORD: '${DATABASE_PASSWORD}'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET (at least 32 characters)}'
      # The public address of the site: e-mail links are built from it, and it is the only
      # origin allowed to call the API from a browser.
      FRONTEND_URL: '${PUBLIC_URL:?set PUBLIC_URL}'
      CORS_ALLOWED_ORIGINS: '${PUBLIC_URL}'
      MANAGEMENT_PORT: '9090'
      MAIL_ENABLED: '${MAIL_ENABLED:-false}'
      SPRING_MAIL_HOST: '${SPRING_MAIL_HOST:-}'
      SPRING_MAIL_PORT: '${SPRING_MAIL_PORT:-587}'
      SPRING_MAIL_USERNAME: '${SPRING_MAIL_USERNAME:-}'
      SPRING_MAIL_PASSWORD: '${SPRING_MAIL_PASSWORD:-}'
      MAIL_FROM: '${MAIL_FROM:-VitalPair <no-reply@vitalpair.app>}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      ANTHROPIC_MODEL: '${ANTHROPIC_MODEL:-claude-sonnet-5}'
      SCHEDULING_ZONE: '${SCHEDULING_ZONE:-America/Sao_Paulo}'
      # The JVM's own zone, which is what the season, the weekly competition, the missions
      # and the plans mean by "today". Meals and activities already use the person's zone;
      # with the JVM left in UTC the two disagreed every night from 21:00 to midnight in
      # Brasília, and the points logged then fell outside a season that had just started.
      # The same value the tests pin (pom.xml) and UserTimeZones falls back to.
      TZ: '${SCHEDULING_ZONE:-America/Sao_Paulo}'
      OPEN_FOOD_FACTS_USER_AGENT: '${OPEN_FOOD_FACTS_USER_AGENT:-VitalPair/1.0 (contact@vitalpair.app)}'
      # Off unless the env file says otherwise. Staging turns it on and the edge puts basic
      # auth in front; production never does, and the edge answers 404 on those paths anyway.
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-false}'
    # The process runs as an unprivileged user already; these keep it from ever becoming
    # anything else, whatever a dependency turns out to do.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: '${BACKEND_MEM_LIMIT:-768m}'
    cpus: '${BACKEND_CPUS:-1.0}'
    logging: *logging
    networks:
      internal:
      edge:
        # The alias is what lets one proxy serve two environments on one machine:
        # backend-staging and backend-production are different names on the same network.
        aliases: ['backend-${ENVIRONMENT}']

  frontend:
    image: '${FRONTEND_IMAGE:-vitalpair-frontend:local}'
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the bundle, because the browser needs it and Vite resolves VITE_*
        # at build time. Empty means the Google button does not render, which is right
        # for an environment where sign-in with Google is not configured.
        VITE_GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: '${FRONTEND_MEM_LIMIT:-128m}'
    cpus: '${FRONTEND_CPUS:-0.5}'
    logging: *logging
    networks:
      edge:
        aliases: ['frontend-${ENVIRONMENT}']

volumes:
  pgdata:
  redisdata:

networks:
  # Database and cache live here and are unreachable from the proxy.
  internal:
  # Created once per machine by compose.edge.yaml; both stacks join it.
  edge:
    external: true
    name: vitalpair_edge
