# The edge: one per machine, in front of every environment.
#
#   docker compose -f deploy/compose.edge.yaml --env-file deploy/env/edge.env up -d
#
# It owns ports 80 and 443 and the certificates. The application stacks stay unpublished
# and are reached over the shared network by their alias, which is what allows staging and
# production to coexist here without either being reachable except through this proxy.
# Which of the two this machine serves is decided by which *_SERVER_NAME is set in edge.env:
# nginx/docker-entrypoint.d/15-render-sites.sh writes one site per name at startup.

name: 'vitalpair-edge'

services:
  nginx:
    image: 'nginx:1.29-alpine'
    ports:
      # Only a rehearsal on a developer machine, where 80 and 443 are usually taken, changes
      # these. A server answers on the real ports.
      - '${EDGE_HTTP_PORT:-80}:80'
      - '${EDGE_HTTPS_PORT:-443}:443'
    environment:
      STAGING_SERVER_NAME: '${STAGING_SERVER_NAME:-}'
      PRODUCTION_SERVER_NAME: '${PRODUCTION_SERVER_NAME:-}'
      # The image renders every file in templates/ through envsubst at startup, replacing
      # only the names listed here. DOLLAR is how an nginx variable survives that pass.
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: '.template'
      DOLLAR: '$$'
    volumes:
      - './nginx/templates:/etc/nginx/templates:ro'
      - './nginx/site.conf.template:/etc/nginx/site.conf.template:ro'
      - './nginx/docker-entrypoint.d/15-render-sites.sh:/docker-entrypoint.d/15-render-sites.sh:ro'
      - './nginx/extras:/etc/nginx/extras:ro'
      - './nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro'
      # Basic-auth users for the staging extras, written by scripts/htpasswd.sh before the
      # first start: a file that does not exist yet would be mounted as an empty directory.
      - './env/htpasswd:/etc/nginx/htpasswd:ro'
      - 'certs:/etc/letsencrypt:ro'
      - 'acme:/var/www/certbot:ro'
    healthcheck:
      # Whether nginx answers at all. Whether the sites behind it work is the smoke test's
      # question: a proxy is not unhealthy because a stack it fronts is down. BusyBox's
      # wget follows the 301 into a certificate it cannot verify and exits non-zero, which
      # is why the status line is what is looked at rather than the exit code.
      test: ['CMD-SHELL', 'wget -S --spider -T 5 http://127.0.0.1/ 2>&1 | grep -q "HTTP/"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: '${NGINX_MEM_LIMIT:-128m}'
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks: [edge]

  # nginx reads a certificate once, at startup, so a renewal would sit on disk unused until
  # something restarted the container and the site would serve an expired certificate.
  # This asks nginx to re-read its files once a day. It is a separate container on purpose:
  # replacing nginx's own command would bypass the entrypoint that renders the sites,
  # which is exactly the mistake that left the stock configuration in place here once.
  nginx-reloader:
    image: 'docker:cli'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        sleep 24h & wait $${!};
        docker exec vitalpair-edge-nginx-1 nginx -s reload || true;
      done'
    restart: unless-stopped
    depends_on: [nginx]
    logging: *logging

  # Renews the certificates long before they expire. Let's Encrypt issues for ninety days and
  # renews at thirty left, so twice a day is generous and costs nothing: certbot exits
  # immediately when there is nothing to do.
  certbot:
    image: 'certbot/certbot:latest'
    volumes:
      - 'certs:/etc/letsencrypt'
      - 'acme:/var/www/certbot'
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    restart: unless-stopped
    logging: *logging

volumes:
  certs:
  acme:

networks:
  edge:
    name: vitalpair_edge
