name: CodeQL

# Static security analysis. Runs on every pull request so a vulnerability is caught
# before it reaches main, and weekly so newly published rules are applied to code that
# has not changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC. Off-hours so a long run never competes with a pull request.
    - cron: '0 6 * * 1'

# Cancel an in-progress analysis when the branch is pushed again; only the latest
# commit's result matters.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Least privilege: read the code, write the findings, nothing else.
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # security-and-quality adds maintainability rules on top of the security ones.
          queries: security-and-quality

      # The Java analysis needs compiled bytecode. Tests are skipped because CI already
      # runs them; this build exists only to produce classes for CodeQL to read.
      - name: Build backend
        if: matrix.language == 'java-kotlin'
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
