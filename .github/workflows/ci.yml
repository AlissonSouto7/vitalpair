name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, except on
# main, where every commit is kept because it is the deployable branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest ships with Docker, which Testcontainers needs.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  # Nothing built the Dockerfiles before this job existed, which meant a pull request
  # changing a base image passed every check without anything having compiled it. Two of
  # them did exactly that: a bump of the build JDK to 26 and of the runtime JRE to 25 both
  # went green while CI tested on 17. A base image is the JVM the product actually runs on,
  # so it deserves a check that is about it.
  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The server is ARM, and every base image has to exist for it. One did not: Temurin's
      # Alpine JRE is published for amd64 only, which the amd64 build below never noticed
      # and the first real build did. Building for arm64 under emulation here would take
      # most of an hour; asking the registry takes seconds and catches the same mistake.
      - name: Every base image exists for arm64
        run: |
          for image in $(grep -hE '^FROM ' Dockerfile frontend/Dockerfile | awk '{print $2}' | sort -u); do
            if docker manifest inspect "$image" | grep -q '"architecture": "arm64"'; then
              echo "ok   $image"
            else
              echo "FAIL $image has no arm64 build"
              exit 1
            fi
          done

      - name: Build the backend image
        run: docker build -t vitalpair-backend:ci .

      - name: Build the frontend image
        run: docker build -t vitalpair-frontend:ci ./frontend

      # Building proves the image assembles; this proves it runs. The application needs a
      # database and a cache to start at all, because Flyway migrates before the context
      # finishes, so both are here rather than being mocked away: an image that boots
      # against a real Postgres is the thing worth asserting.
      - name: Start a database and a cache
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_DB=vitalpair -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci \
            postgres:16-alpine
          docker run -d --name smoke-redis --network smoke \
            redis:7-alpine redis-server --requirepass ci
          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -U ci -d vitalpair && break
            sleep 2
          done

      - name: The backend image starts and answers its readiness probe
        run: |
          docker run -d --name backend-smoke --network smoke \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DATABASE_URL=jdbc:postgresql://smoke-db:5432/vitalpair \
            -e DATABASE_USER=ci -e DATABASE_PASSWORD=ci \
            -e REDIS_HOST=smoke-redis -e REDIS_PASSWORD=ci \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            -e FRONTEND_URL=http://localhost:5173 \
            -e MANAGEMENT_PORT=9090 \
            vitalpair-backend:ci
          # Health lives on the management port, which is deliberately not published; asking
          # from inside the container is what the image's own HEALTHCHECK does.
          for _ in $(seq 1 45); do
            if docker exec backend-smoke wget -qO- http://127.0.0.1:9090/actuator/health/readiness 2>/dev/null | grep -q '"status":"UP"'; then
              echo "The backend image is ready."
              docker rm -f backend-smoke
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' backend-smoke)" != "true" ]; then
              echo "The backend image exited instead of starting:"
              docker logs backend-smoke
              exit 1
            fi
            sleep 2
          done
          echo "The backend image never became ready:"
          docker logs backend-smoke
          exit 1

      # Asked from inside the container rather than through a published port: nothing here
      # needs the host, and binding one is how this step fails on a machine that happens to
      # have something else on that port.
      - name: The frontend image serves the application
        run: |
          docker run -d --name frontend-smoke vitalpair-frontend:ci
          # 127.0.0.1 rather than localhost: the entrypoint's
          # 10-listen-on-ipv6-by-default.sh makes localhost resolve to ::1 first, and
          # nothing answers there. The first run of this job failed for exactly that, with
          # nginx healthy in the logs and every request refused.
          for _ in $(seq 1 20); do
            if docker exec frontend-smoke wget -qO- http://127.0.0.1:8080/ 2>/dev/null | grep -q '<div id="root"'; then
              echo "The frontend image is serving the application."
              docker rm -f frontend-smoke
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' frontend-smoke)" != "true" ]; then
              echo "The frontend image exited instead of serving:"
              docker logs frontend-smoke
              exit 1
            fi
            sleep 2
          done
          echo "The frontend image never answered:"
          docker logs frontend-smoke
          exit 1

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the version, shared with local development.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # Type errors are the cheapest failure to find, so they run first.
      - name: Type check
        run: npm run typecheck

      # Fails on any error. Nine warnings remain, all the useEffect-fetching pattern in the
      # screens that have not moved to TanStack Query yet; they are downgraded explicitly in
      # eslint.config.js with the reason written next to them, so they stay in this output.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # These drive the real application, so they need the API, the database and Redis. The
    # backend runs from the packaged jar rather than from source: that is the artefact a
    # deploy would ship, and building it here also proves it starts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vitalpair
          POSTGRES_USER: vitalpair
          POSTGRES_PASSWORD: vitalpair
        options: >-
          --health-cmd "pg_isready -U vitalpair -d vitalpair"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tests already ran in the backend job; this only needs the jar.
      - name: Package the backend
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -Djacoco.skip=true package

      - name: Start the backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/vitalpair
          DATABASE_USER: vitalpair
          DATABASE_PASSWORD: vitalpair
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          JWT_SECRET: ci-secret-0123456789-0123456789-0123456789
          # The browser tests run against the preview server on 4173.
          CORS_ALLOWED_ORIGINS: http://localhost:4173
          MAIL_ENABLED: 'false'
          # The suite runs serially from one address and renews the session on every screen
          # it opens, so it competes with itself for allowances sized for one person. Refresh
          # is the one it exhausts first, at roughly one per page load. Raised only here:
          # production keeps 10, 5 and 30, which are the defaults in the code, and
          # RateLimitIT still proves the guard at those numbers.
          VITALPAIR_RATELIMIT_LOGIN_PER_MINUTE: '60'
          VITALPAIR_RATELIMIT_REGISTER_PER_MINUTE: '30'
          VITALPAIR_RATELIMIT_REFRESH_PER_MINUTE: '500'
        run: |
          nohup java -jar target/vitalpair-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9090/actuator/health > /dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not start"; tail -50 backend.log; exit 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # --with-deps runs apt-get update across every repository the runner has configured,
      # and a corrupt index on any one of them fails the whole step, so the browser tests
      # never start. Google's Chrome repository served a bad index for over ten minutes
      # ("Hash Sum mismatch"), failing three runs in a row including three retries inside
      # one of them, so it is not something waiting fixes.
      #
      # That repository is preinstalled on the runner and has nothing to do with the
      # libraries Playwright needs, which come from Ubuntu's own archive. Dropping it
      # removes the dependency without weakening anything: if a package Playwright actually
      # needs cannot be fetched, the step still fails.
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          # Matched by glob rather than one exact name: the runner image has moved this
          # file before, and a rename would silently bring the failure back.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* || true
          sudo rm -f /etc/apt/sources.list.d/*google.list || true
          npx playwright install chromium --with-deps

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Run browser tests
        working-directory: frontend
        run: npm run e2e

      # The report names which step failed and carries a video and a trace of it, which is
      # the difference between "the browser test failed" and knowing why.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
