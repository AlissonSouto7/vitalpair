name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, except on
# main, where every commit is kept because it is the deployable branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest ships with Docker, which Testcontainers needs.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth for the version, shared with local development.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # Type errors are the cheapest failure to find, so they run first.
      - name: Type check
        run: npm run typecheck

      # Fails on any error. Ten warnings remain, all the useEffect-fetching pattern that
      # phase 9 replaces wholesale; they are downgraded explicitly in eslint.config.js
      # with the reason written next to them, so they stay visible in this output.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
