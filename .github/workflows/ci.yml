name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress, except on
# main, where every commit is kept because it is the deployable branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest ships with Docker, which Testcontainers needs.
      - name: Build and test
        run: ./mvnw -B -ntp verify
