name: Deploy

# Dispara ao publicar na main (após o merge da release). Requer os secrets:
#   ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY  (acesso SSH ao servidor)
# O GHCR usa o GITHUB_TOKEN automático. No servidor deve existir o diretório do
# projeto com compose.prod.yaml e um arquivo .env com os secrets de produção.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define a tag da imagem
        id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/vitapair-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/vitapair-backend:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (zero-downtime no backend)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/vitapair
            export BACKEND_IMAGE='${{ needs.build-image.outputs.image }}'
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yaml pull backend
            docker compose -f compose.prod.yaml up -d --no-deps backend
            docker image prune -f
