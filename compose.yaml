services:
  postgres:
    image: 'postgres:15-alpine'
    environment:
      - 'POSTGRES_DB=${DATABASE_NAME:-vitalpair}'
      - 'POSTGRES_USER=${DATABASE_USER:-vitalpair}'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD:-vitalpair}'
    ports:
      # Porta do host parametrizável para evitar conflito com outros Postgres locais.
      - '${VITALPAIR_DB_PORT:-5432}:5432'
    volumes:
      - 'vitalpair_postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-vitalpair} -d ${DATABASE_NAME:-vitalpair}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    ports:
      - '${VITALPAIR_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vitalpair_postgres_data:
