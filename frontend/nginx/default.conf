# Serves the built single-page application.
#
# This nginx sits behind the edge proxy and knows nothing about TLS or the API; its only
# job is to hand out files correctly. The edge routes /api to the backend before a request
# ever reaches here.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Never announce the version: it tells anyone probing which known vulnerabilities to try.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets carry a content hash in their filename, so a given URL can never change. A year
    # of caching means a returning visitor downloads only what actually changed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current asset hashes,
    # so a stale copy points the browser at files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Every unknown path is a client-side route. Without this, refreshing the page on
    # /dashboard asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: the edge sets these too, but a request that reaches here directly
    # should not be less protected.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
