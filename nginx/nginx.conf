# Nginx como reverse proxy do VitaPair.
# Hoje encaminha tudo para o backend. Quando o frontend (React) existir, o build
# estático passa a ser servido em `/` e o backend fica só sob `/api/`.

upstream vitapair_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name vitapair.duckdns.org;

    # Para o desafio HTTP-01 do certbot (emissão/renovação do certificado).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Em produção com SSL, redirecionar para HTTPS:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://vitapair_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}

