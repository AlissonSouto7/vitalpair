<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:flex-end;justify-content:center">{{ svg }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:150,&quot;height&quot;:170},&quot;who&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;you&quot;,&quot;partner&quot;],&quot;default&quot;:&quot;you&quot;,&quot;tsType&quot;:&quot;'you'|'partner'&quot;},&quot;expr&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;smug&quot;,&quot;sad&quot;,&quot;strong&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:1,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:40,&quot;max&quot;:240,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  O(){return{body:'#ff7a2e',light:'#ffac63',dark:'#dd5a16',belly:'#fff0db',cheek:'rgba(255,120,80,.4)',sprout:'#3fae5e',sproutLt:'#5fce80'};}
  P(){return{body:'#9b5cf0',light:'#c49bf6',dark:'#7338cf',belly:'#f4eefe',cheek:'rgba(180,120,255,.34)',sprout:'#3fae5e',sproutLt:'#5fce80'};}

  sproutEls(c,lvl){
    const e=[]; const L=Math.max(1,Math.min(8,lvl));
    const stemTop=Math.max(4,15-L*1.5);
    e.push(React.createElement('path',{d:`M50 20 L50 ${stemTop+1}`,fill:'none',stroke:c.sprout,strokeWidth:2.8,strokeLinecap:'round'}));
    const ly=stemTop, s=0.5+L*0.105;
    const leaves=[React.createElement('path',{key:'r',d:'M0 2 C6 -4 12 -2 13 3 C7 5 1 4 0 2 Z',fill:c.sproutLt})];
    if(L>=2) leaves.unshift(React.createElement('path',{key:'l',d:'M0 1 C-6 -5 -12 -3 -13 2 C-7 4 -2 3 0 1 Z',fill:c.sprout}));
    if(L>=5) leaves.push(React.createElement('path',{key:'c',d:'M0 1 C-2 -7 1 -12 3 -14 C3 -8 3 -3 0 1 Z',fill:c.sprout}));
    e.push(React.createElement('g',{transform:`translate(50 ${ly}) scale(${s})`},...leaves));
    if(L===7){ e.push(React.createElement('circle',{cx:50,cy:ly-6*s,r:3.4,fill:'#9b2242'})); }
    if(L>=8){
      const fy=ly-6*s;
      [0,1,2,3,4].forEach(i=>{const a=i*72-90;const rad=a*Math.PI/180;const px=50+Math.cos(rad)*4.4,py=fy+Math.sin(rad)*4.4;e.push(React.createElement('ellipse',{cx:px,cy:py,rx:3,ry:4.4,fill:'#9b2242',transform:`rotate(${a+90} ${px} ${py})`}));});
      e.push(React.createElement('circle',{cx:50,cy:fy,r:2.5,fill:'#ffd98a'}));
    }
    return e;
  }

  base(c, expr, arms, g, lvl){
    const G=[]; const id='g'+Math.random().toString(36).slice(2,7);
    G.push(React.createElement('defs',null,
      React.createElement('linearGradient',{id,x1:'0',y1:'0',x2:'0',y2:'1'},
        React.createElement('stop',{offset:'0%',stopColor:c.light}),
        React.createElement('stop',{offset:'100%',stopColor:c.body}))));
    G.push(React.createElement('ellipse',{cx:50,cy:108,rx:27,ry:4.5,fill:'rgba(0,0,0,.08)'}));
    G.push(React.createElement('ellipse',{cx:42,cy:101,rx:7,ry:4.5,fill:c.dark}));
    G.push(React.createElement('ellipse',{cx:58,cy:101,rx:7,ry:4.5,fill:c.dark}));
    if(arms==='up'){
      G.push(React.createElement('ellipse',{cx:18,cy:50,rx:7,ry:8.5,fill:c.body}));
      G.push(React.createElement('ellipse',{cx:82,cy:50,rx:7,ry:8.5,fill:c.body}));
    } else {
      G.push(React.createElement('ellipse',{cx:15,cy:66,rx:7,ry:9,fill:c.body}));
      G.push(React.createElement('ellipse',{cx:85,cy:66,rx:7,ry:9,fill:c.body}));
    }
    this.sproutEls(c, lvl===undefined?6:lvl).forEach(el=>G.push(el));
    G.push(React.createElement('path',{d:'M50 18 C72 18 84 35 84 57 C84 80 70 97 50 97 C30 97 16 80 16 57 C16 35 28 18 50 18 Z',fill:`url(#${id})`}));
    G.push(React.createElement('path',{d:'M50 47 C63 47 71 59 70 72 C69 86 60 95 50 95 C40 95 31 86 30 72 C29 59 37 47 50 47 Z',fill:c.belly}));
    G.push(React.createElement('ellipse',{cx:30,cy:57,rx:4.6,ry:3,fill:c.cheek}));
    G.push(React.createElement('ellipse',{cx:70,cy:57,rx:4.6,ry:3,fill:c.cheek}));
    const ink='#2a1810';
    [[38,-1],[62,1]].forEach(([x,dir])=>{
      if(expr==='smug' && dir===1){
        G.push(React.createElement('path',{d:`M${x-7} 47 Q${x} 53 ${x+7} 47`,fill:'none',stroke:ink,strokeWidth:2.6,strokeLinecap:'round'}));
      } else {
        G.push(React.createElement('ellipse',{cx:x,cy:47,rx:7.6,ry:9,fill:'#fff'}));
        G.push(React.createElement('circle',{cx:x+0.5,cy:49,r:5,fill:ink}));
        G.push(React.createElement('circle',{cx:x+2.4,cy:46.6,r:1.9,fill:'#fff'}));
        G.push(React.createElement('circle',{cx:x-1.4,cy:51,r:1,fill:'#fff',opacity:.8}));
        if(g==='f'){
          G.push(React.createElement('path',{d:`M${x+dir*5.5} 39.5 q${dir*0.5} -3 ${dir*-0.5} -5.2`,fill:'none',stroke:ink,strokeWidth:1.8,strokeLinecap:'round'}));
          G.push(React.createElement('path',{d:`M${x+dir*7.4} 40 q${dir*1.5} -3 ${dir*1.2} -5.4`,fill:'none',stroke:ink,strokeWidth:1.8,strokeLinecap:'round'}));
          G.push(React.createElement('path',{d:`M${x+dir*8.8} 42 q${dir*2.6} -2.4 ${dir*3.2} -4.4`,fill:'none',stroke:ink,strokeWidth:1.8,strokeLinecap:'round'}));
        }
      }
    });
    if(g==='m'){
      const bw=3, brow=(d)=>G.push(React.createElement('path',{d,fill:'none',stroke:ink,strokeWidth:bw,strokeLinecap:'round'}));
      if(expr==='smug'){ brow('M29 32 Q34 28 42 32'); brow('M58 36 Q64 37 70 34'); }
      else if(expr==='sad'){ brow('M30 38 Q35 34 42 36'); brow('M58 36 Q65 34 70 38'); }
      else if(expr==='strong'){ brow('M30 32 L42 36'); brow('M58 36 L70 32'); }
      else { brow('M30 34 Q35 31 42 34'); brow('M58 34 Q65 31 70 34'); }
    }
    if(expr==='happy'){
      G.push(React.createElement('path',{d:'M44 61 Q50 67 56 61',fill:'none',stroke:ink,strokeWidth:2.4,strokeLinecap:'round'}));
    } else if(expr==='smug'){
      G.push(React.createElement('path',{d:'M44 62 Q51 66 57 60',fill:'none',stroke:ink,strokeWidth:2.4,strokeLinecap:'round'}));
    } else if(expr==='sad'){
      G.push(React.createElement('path',{d:'M44 65 Q50 60 56 65',fill:'none',stroke:ink,strokeWidth:2.4,strokeLinecap:'round'}));
      G.push(React.createElement('path',{d:'M64 54 q-2.4 4 0 6.4 q2.4 -2.4 0 -6.4 Z',fill:'#6cc4ff'}));
    } else {
      G.push(React.createElement('path',{d:'M43 60 Q50 69 57 60 Q50 64 43 60 Z',fill:ink}));
      G.push(React.createElement('path',{d:'M48 63 Q50 66 52 63 Z',fill:'#ff7a8a'}));
    }
    return G;
  }

  renderVals(){
    const who=this.props.who||'you';
    const c= who==='partner'?this.P():this.O();
    const g= this.props.gender || (who==='partner'?'f':'m');
    const expr=this.props.expr||'happy';
    const lvl=this.props.level||6;
    const px=Number(this.props.size)||120;
    const arms= expr==='strong'?'up':'side';
    return { svg: React.createElement('svg',{width:px*0.84,height:px,viewBox:'0 -18 100 130'}, ...this.base(c,expr,arms,g,lvl)) };
  }
}
</script>
</body>
</html>
