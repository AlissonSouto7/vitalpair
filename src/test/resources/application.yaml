# Test configuration. This file shadows the main application.yaml on the test classpath,
# so every property the context needs at startup must be declared here.
# Spring-context tests get Postgres and Redis from TestcontainersConfiguration.
spring:
  docker:
    compose:
      enabled: false

vitalpair:
  jwt:
    secret: test-secret-0123456789-0123456789-0123456789
    access-expiration-ms: 900000
    refresh-expiration-ms: 2592000000
  cors:
    allowed-origins: http://localhost:5173
  ai:
    anthropic:
      # Required by the Feign clients to build their base URL. No test calls it;
      # integration tests will point it at a WireMock server.
      base-url: http://localhost:1
