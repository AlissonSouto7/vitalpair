server:
  # Dev roda em 8081 por padrão para coexistir com outros serviços locais na 8080.
  port: ${SERVER_PORT:8081}

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

vitalpair:
  jwt:
    # Segredo padrão APENAS para desenvolvimento local. Em produção use a env var JWT_SECRET.
    secret: ${JWT_SECRET:vitapair-dev-secret-change-me-please-0123456789abcdef}

logging:
  level:
    com.aps.vitalpair: DEBUG
    org.hibernate.SQL: DEBUG
