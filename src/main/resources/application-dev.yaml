server:
  # Dev roda em 8081 por padrão para coexistir com outros serviços locais na 8080.
  port: ${SERVER_PORT:8081}
  # Same setting as prod. In development every request reaches Tomcat from the Vite proxy
  # on 127.0.0.1, so without this the rate limiter keys every visitor to the same address
  # and one abusive caller through a tunnel locks everyone out. Tomcat only honours
  # X-Forwarded-* from private ranges, so a caller on the open internet cannot spoof it.
  forward-headers-strategy: native

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

vitalpair:
  auth:
    # Local development runs on http, and a Secure cookie is never sent over it, so the
    # session would silently never work. Production leaves this at its default of true.
    cookie-secure: false
  jwt:
    # No default on purpose. A committed secret in the default profile means a deploy that
    # forgets SPRING_PROFILES_ACTIVE signs real tokens with a value anyone can read in this
    # repository. When JWT_SECRET is unset, DevJwtSecretGenerator supplies a random one for
    # this run, so a fresh clone still starts with no configuration.
    secret: ${JWT_SECRET:}

logging:
  level:
    com.aps.vitalpair: DEBUG
    org.hibernate.SQL: DEBUG
