# Profile de produção (ativado com SPRING_PROFILES_ACTIVE=prod).
# Todas as credenciais vêm de variáveis de ambiente (ver .env.example / docker compose).
spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  # Behind nginx, Tomcat sees the proxy's address on every request. Without this the client
  # IP in logs and in rate-limit keys is the proxy, so one abusive caller looks like all of
  # them and a per-IP limit blocks everyone at once.
  forward-headers-strategy: native

# The interactive API browser is a complete map of every endpoint and payload shape. Useful
# while developing, an invitation in production. Disabled rather than merely unlinked,
# because an unlinked page is still a page.
#
# Staging runs this same profile and turns it on through SWAGGER_ENABLED, with the edge
# proxy putting basic auth in front of the pages. Production never sets the flag, and the
# edge answers 404 on those paths there regardless.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  # One JSON object per line, in the Elastic Common Schema. A log aggregator can then filter
  # by requestId or userId instead of matching text, and a stack trace stays one event rather
  # than forty unrelated lines. Native to Boot since 3.4, so no logging dependency is needed.
  structured:
    format:
      console: ecs
  level:
    com.aps.vitalpair: INFO
    org.hibernate.SQL: WARN
