spring:
  application:
    name: vitapair
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vitapair}
    username: ${DATABASE_USER:vitapair}
    password: ${DATABASE_PASSWORD:vitapair}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

vitapair:
  jwt:
    # Em produção, JWT_SECRET deve ter no mínimo 32 caracteres (256 bits para HS256).
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aps.vitapair: ${LOG_LEVEL:INFO}
