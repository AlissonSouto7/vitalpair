spring:
  application:
    name: vitalpair
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vitalpair}
    username: ${DATABASE_USER:vitalpair}
    password: ${DATABASE_PASSWORD:vitalpair}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # SMTP (envio de e-mail real). Em dev fica vazio e o envio é desligado (ver vitalpair.mail.enabled).
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Both are on by default, as any real provider requires. They are configurable
          # so a local fake SMTP server (Mailpit, in compose.yaml) can be used without
          # credentials or TLS.
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

vitalpair:
  app:
    # Base do frontend, usada para montar o link de redefinição de senha enviado por e-mail.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Em produção, JWT_SECRET deve ter no mínimo 32 caracteres (256 bits para HS256).
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  password-reset:
    token-ttl-ms: ${PASSWORD_RESET_TTL_MS:1800000}
  email-verification:
    token-ttl-ms: ${EMAIL_VERIFICATION_TTL_MS:86400000}
  mail:
    # Em dev fica desabilitado: o link de redefinição é apenas logado no console.
    # Em produção, defina MAIL_ENABLED=true e as variáveis spring.mail.* (SMTP).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:VitalPair <no-reply@vitalpair.app>}
  cors:
    # Separate from FRONTEND_URL on purpose. FRONTEND_URL builds links in e-mails and must
    # be exactly one URL; CORS may need several (a local dev server plus a tunnel used to
    # show the app to someone). Comma-separated. Falls back to FRONTEND_URL so the common
    # case needs no extra configuration.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  openfoodfacts:
    base-url: https://world.openfoodfacts.org
    search-url: https://search.openfoodfacts.org
    user-agent: ${OPEN_FOOD_FACTS_USER_AGENT:VitalPair/1.0 (contact@vitalpair.app)}
  scheduling:
    # The server's own zone is not the users' zone. In production the JVM usually runs in UTC,
    # which would fire the 09:00 flash mission at 06:00 in Brazil and shift the reminder's
    # notion of "today" into the middle of the night.
    zone: ${SCHEDULING_ZONE:America/Sao_Paulo}
    flash-mission-cron: ${FLASH_MISSION_CRON:0 0 9 * * *}
    log-reminder-cron: ${LOG_REMINDER_CRON:0 0 20 * * *}
  ai:
    anthropic:
      # Análise de refeição por foto (visão). Com a chave em branco, a integração fica desligada
      # e o endpoint POST /api/v1/nutrition/photo responde 503 com mensagem amigável.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      model: ${ANTHROPIC_MODEL:claude-opus-4-8}

management:
  # Operational endpoints on a port of their own, so publishing the API to the internet does
  # not publish metrics with it. The port is bound but never mapped by the reverse proxy.
  #
  # Health moves with them. The container healthcheck and the load balancer are both inside
  # the network and can reach 9090; nothing outside needs it, and an unauthenticated health
  # endpoint on the public port is one more thing to probe.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Never expose the details publicly: they name the database, the Redis host and which
      # component is failing, which is a map of the system for anyone probing it.
      show-details: never
      probes:
        enabled: true
  health:
    # Não amarrar a saúde do app à disponibilidade do SMTP (e em dev o host fica vazio).
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# Circuit breakers and retries for the two external APIs. The numbers are deliberately
# different, because the failure modes are: Anthropic is paid and slow, Open Food Facts is
# free, fast and flaky.
resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        # Ten calls at roughly 20 seconds each is a slow window on purpose: half of them
        # failing is a real outage, not a couple of unlucky requests.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # A refusal or an unparseable answer means the partner replied and the reply is not
        # usable: it says nothing about the partner's health. Counting those would let a few
        # unusual prompts disable the feature for everyone.
        ignore-exceptions:
          - com.aps.vitalpair.ai.domain.exception.PlanContentException
          - com.aps.vitalpair.ai.domain.exception.AiPlanNotConfiguredException
          - com.aps.vitalpair.mealvision.domain.exception.MealPhotoContentException
          - com.aps.vitalpair.mealvision.domain.exception.AiNotConfiguredException
      openfoodfacts:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      openfoodfacts:
        # Two attempts, and only for a connection that never opened.
        #
        # A read timeout is 5s, so three attempts on a stalled server meant a user waiting
        # over fifteen seconds for a search box: measured at 15.6s before this was narrowed.
        # Retrying a request that reached the server and then hung just multiplies the wait,
        # while retrying one whose connection was refused is nearly free and often works.
        max-attempts: 2
        wait-duration: 200ms
        # Only a connection that never opened is retried. A read timeout arrives wrapped in
        # ResourceAccessException just like a refused connection, so listing that class as
        # retryable brought the stalled case back: measured 10.2s for a search box. The
        # narrower type is the one that distinguishes "nobody answered the door" from
        # "someone answered and then went quiet".
        retry-exceptions:
          - java.net.ConnectException

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aps.vitalpair: ${LOG_LEVEL:INFO}
